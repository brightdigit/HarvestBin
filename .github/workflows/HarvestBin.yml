name: HarvestBin
on:
  push:
    branches-ignore:
      - '*WIP'
env:
  PACKAGE_NAME: HarvestBin      
jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      matrix:
        image:
          - swift:6.0
          - swift:6.1
          - swift:6.2
          - swiftlang/swift:nightly-6.2-noble
          - swiftlang/swift:nightly-6.3-noble
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Update BushelKit dependency to use subrepo branch
        run: |
          sed -i 's|.package(path: "../../../BushelKit")|.package(url: "https://github.com/brightdigit/BushelKit.git", branch: "subrepo")|g' Packages/HarvestBinKit/Package.swift
      - uses: brightdigit/swift-build@v1.5.0-beta.2
        with:          
          fail-on-empty-output: true
          skip-package-resolved: true
      - uses: sersoft-gmbh/swift-coverage-action@v4
        id: coverage-files
        with:          
          fail-on-empty-output: true
      - name: Set coverage flag
        id: set-flag
        run: echo "CODECOV_FLAGS=${MATRIX_IMAGE//\//-}" | sed 's/:/-/g' >> $GITHUB_ENV
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4       
        with:
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          verbose: true        
          token: ${{ secrets.CODECOV_TOKEN }}  
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}  
